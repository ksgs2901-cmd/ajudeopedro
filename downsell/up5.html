      transform: translateX(-50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(223, 169, 60, .35), transparent 70%);

      z-index: 0;
      animation: pulse 2.6s ease-in-out infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .6;
        transform: translateX(-50%) scale(1)
      }

      50% {
        opacity: 1;
        transform: translateX(-50%) scale(1.08)
      }
    }

    .eye {

      letter-spacing: 3px;

    .sub {

      flex-direction: column;
      background: linear-gradient(135deg, #9f731a, #1f1a14);
      border: 1px solid rgba(223, 169, 60, .4);
      border-radius: 20px;
      padding: 16px 30px

    .pricepill .from {
      color: #e9dfc9;

    .pricepill .v {

      font-weight: 900;

      line-height: 1;

    .pricepill .tag {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 800;
      color: var(--l3)

      width: 100%;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #dfa93c, #c58f22);
      color: #0e0c09;
      font-weight: 900;
      font-size: 17px;
      padding: 18px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 0 0 0 rgba(223, 169, 60, .6);
      animation: bpulse 1.8s infinite
    }

    @keyframes bpulse {
      0% {

    .meta {

      font-size: 12px;
      color: #d3af67
    }

    .meta b {
      color: #f9f6f0
    }
