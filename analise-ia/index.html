<style>
:root{--g900:#201b16;--g700:#624710;--g600:#7c5914;--g500:#7c5914;--g400:#a0731a;--gvivid:#2ee06a;--gwash:#f6f2e9;--ink:#221d17;--mut:#83796c;--line:#eae9e6;
--or:#f0900f;--or-vivid:#ff9e1b;--or-deep:#d9760a;--or-wash:#fef1de;--or-line:#f7d9ad;--or-glow:rgba(240,144,15,.5);
--wa-head:#8c6312;--wa-head2:#3d3328;--ease-out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(130% 90% at 50% 0%,#f3efe7,#f6f4ee);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:14px 12px;min-height:100dvh}

/* ===== Popup (janela do chat) ===== */
.app{width:100%;max-width:410px;height:calc(100dvh - 28px);max-height:880px;display:flex;flex-direction:column;background:#e5ddd5;overflow:hidden;border-radius:22px;border:1px solid rgba(124, 89, 20, .14);box-shadow:0 30px 60px -26px rgba(32, 27, 22, .4),0 0 0 1px rgba(124, 89, 20, .08)}

/* ===== Header (consultora) ===== */
.wa-top{position:relative;z-index:20;background:linear-gradient(135deg,var(--wa-head),var(--wa-head2));color:#fff;display:flex;align-items:center;gap:11px;padding:12px 14px}
.wa-top::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 90% 0%,rgba(46,224,106,.35),transparent 55%)}
.wa-top .bk{opacity:.9;display:flex;position:relative;z-index:1}
.wa-top .av{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.4);background:#29221b}
.wa-top .av img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.wa-top .who{flex:1;min-width:0;position:relative;z-index:1}
.wa-top .nm{font-size:15px;font-weight:800;line-height:1.15;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.wa-top .nm .verif{display:inline-flex;flex-shrink:0}
.wa-top .st{font-size:11.5px;color:#d3efe3;display:flex;align-items:center;gap:5px;height:16px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.wa-top .st i{width:7px;height:7px;border-radius:50%;background:#2ee06a;display:inline-block;flex-shrink:0;box-shadow:0 0 8px #2ee06a}
.wa-top .st.typing{color:#f9f6ef;font-style:italic}
.wa-top .ic{margin-left:auto;display:flex;gap:16px;opacity:.9;position:relative;z-index:1}
.wa-prog{height:4px;background:rgba(0,0,0,.16);position:relative;z-index:20}
.wa-prog i{display:block;height:100%;width:6%;background:linear-gradient(90deg,var(--g400),var(--or-vivid));transition:width .5s var(--ease-out);box-shadow:0 0 10px rgba(255,158,27,.5)}
.chan-note{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 16px;background:#fff8e6;border-bottom:1px solid rgba(0,0,0,.05);color:#6b6350;font-size:11px;line-height:1.35;text-align:center;position:relative;z-index:19}
.chan-note svg{flex-shrink:0}
.chan-note b{color:#7a5b1c;font-weight:800}

/* ===== Palco das perguntas ===== */
.stage{position:relative;flex:1;overflow:hidden;background:#e7ded4 url("images/wa-bg.svg") repeat;background-size:320px}
.qpage{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px 14px 28px;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-padding-bottom:28px}
.qpage>*{flex-shrink:0}
.qpage.enter{animation:slideIn .34s cubic-bezier(.22,.9,.31,1) both}
.qpage.leave{animation:slideOut .26s ease both;pointer-events:none}
@keyframes slideIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-30px)}}

/* mensagens da Júlia */
.qtop{display:flex;flex-direction:column;gap:8px;margin-bottom:auto}
.qrow{display:flex;gap:8px;align-items:flex-end;animation:pop .3s ease both}
.qrow .mav{width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;border:1px solid rgba(0,0,0,.06);background:#29221b;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qrow .mav img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.qrow .mav.ghost{visibility:hidden}
.bubble{max-width:84%;padding:11px 14px;border-radius:16px;border-bottom-left-radius:5px;font-size:15px;line-height:1.5;background:#fff;color:#221f1b;box-shadow:0 2px 6px -2px rgba(37, 31, 24, .18)}
.bubble.q{font-weight:600;font-size:16.5px;line-height:1.45}
.bubble b{font-weight:800;color:var(--g600)}
.bubble.typing-b{padding:13px 15px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* indicador de digitação */
.typing{display:inline-flex;gap:4px;align-items:center}
.typing span{width:7px;height:7px;border-radius:50%;background:#c1beba;animation:ty 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes ty{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

/* mensagem de voz */
.voice{display:flex;align-items:center;gap:10px;min-width:210px;max-width:280px}
.voice .play{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--g500);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.voice .wave{flex:1;display:flex;align-items:center;gap:2.5px;height:26px}
.voice .wave i{flex:1;background:#e6d2a9;border-radius:2px;height:30%}
.voice .wave i.on{background:var(--g500)}
.voice .meta{display:flex;flex-direction:column;gap:3px;min-width:34px}
.voice .meta .t{font-size:11px;color:#7c808a;font-weight:600}

/* botões de resposta */
.opts{display:flex;flex-direction:column;gap:10px;padding-top:16px;margin-top:14px;opacity:0;transform:translateY(10px);transition:opacity .32s ease,transform .32s ease;pointer-events:none}
.opts.show{opacity:1;transform:none;pointer-events:auto}
.opt{background:#fff;border:1.5px solid #e6dfcf;color:var(--g700);font-family:inherit;font-size:15px;font-weight:700;padding:15px 16px;border-radius:14px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:11px;box-shadow:0 4px 12px -6px rgba(37, 31, 24, .35);transition:.15s var(--ease-out)}
.opt:hover{border-color:var(--g500);background:#faf8f3;transform:translateY(-1px)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--g500);background:#f7f4ed;box-shadow:0 0 0 2px rgba(124, 89, 20, .2)}
.opt:disabled{opacity:.55;cursor:default}
.opt .em{font-size:19px;line-height:1}
.opt span.lbl{flex:1}
.opt .ar{margin-left:auto;color:var(--g400);display:flex}

/* campo de digitação */
.chat-input{display:flex;gap:9px;padding-top:16px;margin-top:14px;opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .3s ease;pointer-events:none}
.chat-input.show{opacity:1;transform:none;pointer-events:auto}
.chat-input input{flex:1;min-width:0;border:1.5px solid #e6dfcf;border-radius:14px;padding:14px 16px;font-family:inherit;font-size:15px;background:#fff;color:#221f1b;outline:none;box-shadow:0 3px 10px -6px rgba(37, 31, 24, .3)}
.chat-input input:focus{border-color:var(--g500)}
.chat-input input::placeholder{color:#afa89f}
.chat-input button{width:52px;flex-shrink:0;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g400),var(--g600));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px -6px rgba(124, 89, 20, .6)}
.chat-input button:active{transform:scale(.96)}

/* página de "analisando" */
.analyzing{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center;padding:0 24px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(124, 89, 20, .16);border-top-color:var(--g500);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.analyzing .at{font-size:16px;font-weight:800;color:var(--g700)}
.analyzing .as{font-size:13px;color:#69645d}

/* ===== Oferta ===== */
.offer{background:#fff;border-radius:20px;box-shadow:0 22px 50px -22px rgba(37, 31, 24, .5);overflow:hidden;animation:pop .4s ease both;margin-top:14px}
.offer .oh{position:relative;background:radial-gradient(120% 90% at 85% 0%,var(--g400),transparent 55%),linear-gradient(135deg,var(--g700),var(--g500));color:#fff;padding:20px;text-align:center;overflow:hidden}
.offer .oh .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:5px 12px;border-radius:100px;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.offer .oh .ttl{font-size:13px;color:#ece3cf;margin-top:12px}
.offer .oh .big{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.05;margin-top:2px;color:#fff}
.offer .oh .sub{font-size:12px;color:#e9dfc9;margin-top:4px}
.offer .ob{padding:18px}
.offer .sld-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.offer .sld-top .l{font-size:12px;color:var(--mut);font-weight:600}
.offer .sld-top .v{font-size:22px;font-weight:900;color:var(--g700);letter-spacing:-.5px}
.offer input[type=range]{-webkit-appearance:none;width:100%;height:9px;border-radius:6px;background:#ece9e3;outline:none;margin:10px 0 6px}
.offer input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:27px;height:27px;border-radius:50%;background:#fff;border:3px solid var(--g500);box-shadow:0 0 0 5px rgba(124, 89, 20, .14),0 6px 14px -4px rgba(124, 89, 20, .5);cursor:pointer}
.offer input[type=range]::-moz-range-thumb{width:27px;height:27px;border-radius:50%;background:#fff;border:3px solid var(--g500);cursor:pointer}
.offer .sld-lab{display:flex;justify-content:space-between;font-size:11px;color:#d7b675;font-weight:600}
.offer .parc{background:var(--gwash);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.offer .parc .pl{font-size:12px;color:var(--mut)}.offer .parc .pv{font-size:17px;font-weight:800;color:var(--ink)}
.offer .obtn{position:relative;width:100%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--or-vivid),var(--or-deep));color:#fff;font-family:inherit;font-weight:800;font-size:16px;padding:16px;border-radius:14px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:9px;overflow:hidden;box-shadow:0 16px 30px -10px var(--or-glow);animation:breathe 2.4s ease-in-out infinite}
.offer .obtn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-100%);pointer-events:none;animation:btnShine 3.2s var(--ease-out) infinite}
@keyframes btnShine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@keyframes breathe{0%,100%{box-shadow:0 14px 26px -10px var(--or-glow)}50%{box-shadow:0 20px 40px -8px rgba(240,144,15,.65)}}
.offer .obtn:active{transform:scale(.98)}
.offer .sec{text-align:center;font-size:11px;color:var(--mut);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px}

/* ===== NOVA OFERTA: valor + parcelas + resumo ===== */
.vcard,.pgrid,.summary{margin-top:8px}
.vcard{position:relative;background:#fff;border-radius:20px;padding:22px 18px;box-shadow:0 20px 46px -20px rgba(37, 31, 24, .55);animation:pop .4s ease both;overflow:hidden}
.vcard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--g500),var(--g400) 55%,var(--or-vivid))}
.vc-pill{display:inline-flex;align-items:center;gap:6px;background:#f7f4ed;color:var(--g700);border:1px solid #ece3cf;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:5px 11px;border-radius:100px}
.vc-label{font-size:13px;color:#69645d;font-weight:700;margin-top:15px}
.vc-amount{display:flex;align-items:baseline;gap:7px;margin-top:3px;color:var(--g700)}
.vc-amount .cur{font-size:21px;font-weight:800}
.vc-amount #vAmt{font-size:48px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.vc-sub{font-size:12px;color:#7c808a;margin-top:5px}
.vc-range{-webkit-appearance:none;width:100%;height:9px;border-radius:6px;background:#ece9e3;outline:none;margin:20px 0 6px}
.vc-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--g500);box-shadow:0 0 0 5px rgba(124, 89, 20, .14),0 6px 14px -4px rgba(124, 89, 20, .5);cursor:pointer}
.vc-range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--g500);cursor:pointer}
.vc-limits{display:flex;justify-content:space-between;font-size:11px;color:#d7b675;font-weight:700}
.vc-chips{display:flex;gap:8px;margin-top:14px}
.vc-chip{flex:1;border:1.5px solid #e6e0d3;background:#fcfbf8;color:var(--g700);font-family:inherit;font-weight:700;font-size:12.5px;padding:9px 4px;border-radius:11px;cursor:pointer;transition:.15s}
.vc-chip:hover{border-color:var(--g500)}
.vc-chip.on{background:var(--g500);color:#fff;border-color:var(--g500)}

.cta{position:relative;width:100%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--or-vivid),var(--or-deep));color:#fff;font-family:inherit;font-weight:800;font-size:16px;padding:17px;border-radius:15px;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;overflow:hidden;box-shadow:0 16px 30px -12px var(--or-glow),inset 0 1px 0 rgba(255,255,255,.3)}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-100%);pointer-events:none;animation:btnShine 3.2s var(--ease-out) infinite}
.cta:active{transform:scale(.985)}
.cta.breathe{animation:breathe 2.4s ease-in-out infinite}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pcard{position:relative;background:#fff;border:1.6px solid #eae6db;border-radius:15px;padding:16px 13px;cursor:pointer;text-align:left;font-family:inherit;transition:.15s var(--ease-out);box-shadow:0 6px 16px -10px rgba(37, 31, 24, .5)}
.pcard:hover{border-color:var(--g500);transform:translateY(-3px)}
.pcard:active{transform:scale(.985)}
.pcard.pop{border-color:var(--or);background:#fffaf1;box-shadow:0 12px 26px -10px rgba(240,144,15,.45)}
.pc-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(135deg,var(--or-vivid),var(--or-deep));color:#fff;font-size:9px;font-weight:800;letter-spacing:.3px;padding:3px 9px;border-radius:100px;text-transform:uppercase;box-shadow:0 6px 14px -5px var(--or-glow)}
.pc-n{font-size:24px;font-weight:900;color:var(--g700);letter-spacing:-.5px}
.pcard.pop .pc-n{color:var(--or-deep)}
.pc-val{font-size:15px;font-weight:800;color:#221f1b;margin-top:3px}
.pc-val span{font-size:11px;font-weight:600;color:#8a8e97}
.pc-total{font-size:11px;color:#8a8e97;margin-top:5px}

.summary{background:#fff;border-radius:20px;padding:16px;box-shadow:0 20px 46px -20px rgba(37, 31, 24, .55);animation:pop .4s ease both}
.sm-amount{position:relative;background:radial-gradient(120% 90% at 85% 0%,var(--g400),transparent 55%),linear-gradient(135deg,var(--g700),var(--g500));color:#fff;border-radius:16px;padding:18px;text-align:center;margin-bottom:6px;overflow:hidden}
.sm-amount .l{font-size:11px;color:#ece3cf;text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.sm-amount .v{font-size:35px;font-weight:900;letter-spacing:-1px;margin-top:2px}
.sm-amount .s{font-size:11.5px;color:#e9dfc9;margin-top:2px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f3f2f0}
.srow .si{width:36px;height:36px;border-radius:11px;background:#f7f4ed;color:var(--g600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.srow .sl{font-size:12.5px;color:#7c808a;font-weight:600;flex:1}
.srow .sv{font-size:14px;color:#221f1b;font-weight:700;text-align:right}
.srow .sv b{font-weight:900;color:var(--g700)}
.srow .sv small{display:block;font-size:10.5px;color:#a5a19c;font-weight:600;margin-top:1px}
.s-sec{text-align:center;font-size:11px;color:var(--mut);margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px}

/* ===== Assinatura ===== */
.signcard{position:relative;background:#fff;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 20px 46px -20px rgba(37, 31, 24, .55);animation:pop .4s ease both;overflow:hidden}
.signcard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--g500),var(--g400) 55%,var(--or-vivid))}
.sign-h{font-weight:800;color:var(--g700);font-size:16px;display:flex;align-items:center;gap:7px}
.sign-sub{font-size:12px;color:#7c808a;margin:3px 0 12px}
.sign-pad{position:relative;border:2px dashed #e3dccd;border-radius:14px;background:#fdfcf9;height:175px;overflow:hidden;transition:border-color .2s}
.sign-pad.bad{border-color:#ef4444;background:#fef2f2}
.sign-pad::after{content:"assine aqui";position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:#cac5be;pointer-events:none;letter-spacing:.5px}
.sign-pad.inked::after{display:none}
.sign-pad canvas{position:relative;z-index:2;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sign-clear{position:absolute;z-index:3;top:8px;right:8px;background:#f5f3ee;border:1px solid #e6e0d3;color:var(--g700);font-size:11px;font-weight:700;padding:6px 11px;border-radius:9px;cursor:pointer}
.sign-name{width:100%;border:1.5px solid #e6e0d3;border-radius:12px;padding:13px 14px;font-family:inherit;font-size:15px;margin-top:12px;outline:none;color:#221f1b}
.sign-name:focus{border-color:var(--g500)}
.sign-name.bad{border-color:#ef4444}

/* ===== Documento do contrato ===== */
.contract{background:#fff;border-radius:16px;padding:18px 16px;margin-top:12px;border:1px solid #ecedee;box-shadow:0 20px 46px -20px rgba(37, 31, 24, .55);animation:pop .4s ease both;color:#2f2d2a}
.contract .doc-top{text-align:center;border-bottom:1.5px solid #f1f0ee;padding-bottom:10px;margin-bottom:10px}
.contract .doc-top h3{font-size:13.5px;color:var(--g700);letter-spacing:.3px}
.contract .doc-top .ds{font-size:10px;color:#8a8e97;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.contract .field{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed #f1f0ee;font-size:12.5px}
.contract .field .k{color:#7c808a}
.contract .field .v{font-weight:700;color:#221f1b;text-align:right}
.contract .terms{font-size:10.5px;line-height:1.65;color:#69645d;margin-top:11px}
.contract .terms b{color:#221f1b}
.contract .sigblock{margin-top:14px;text-align:center}
.contract .sigblock img{height:74px;max-width:78%;object-fit:contain;display:block;margin:0 auto -6px}
.contract .sigline{border-top:1.6px solid #221f1b;width:72%;margin:0 auto 5px}
.contract .signame{font-weight:800;color:#221f1b;font-size:13px}
.contract .sigmeta{font-size:10px;color:#8a8e97;margin-top:2px}
.contract .stamp{position:relative;margin-top:12px;text-align:center}

   ============================================================ */
:root{--gold:#d9a441;--gold-d:#b9832c;--gold-soft:#f6e6c0}

/* moldura da janela um pouco mais "produto" */
.app{border:1px solid rgba(32, 27, 22, .16);box-shadow:0 34px 70px -28px rgba(32, 27, 22, .5),0 0 0 1px rgba(217,164,65,.14)}

/* ===== Consultora — institucional (verde profundo + anel dourado) ===== */
.wa-top{background:linear-gradient(135deg,#8c6312,#3d3328)}

.wa-top .nm{font-size:15.5px}
.wa-top .st{color:#e5dac0}
.wa-top .ic{align-items:center}
.wa-top .sec-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:#ffe0b0;background:rgba(217,164,65,.16);border:1px solid rgba(217,164,65,.42);padding:6px 11px;border-radius:100px;white-space:nowrap}
.wa-top .sec-tag svg{width:12px;height:12px}

/* progresso com toque dourado */
.wa-prog i{background:linear-gradient(90deg,var(--g400),var(--gold) 58%,var(--or-vivid))}

/* ===== Balões da Júlia ===== */
.bubble{border-radius:18px;border-bottom-left-radius:6px;box-shadow:0 3px 10px -4px rgba(37, 31, 24, .2);border:1px solid rgba(37, 31, 24, .05)}
.bubble.q{background:linear-gradient(180deg,#ffffff,#faf9f5);border-color:rgba(124, 89, 20, .14)}

/* ===== BOTÕES DE RESPOSTA — cards de produto SuperSim ===== */
.opt{border:1.5px solid #e7e3db;border-radius:16px;padding:13px 14px;gap:13px;background:#fff;box-shadow:0 6px 16px -10px rgba(37, 31, 24, .4);transition:.18s var(--ease-out)}
.opt .em{font-size:20px;width:42px;height:42px;min-width:42px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#f7f4ed,#f2ecde);border:1px solid #e6dfcf;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.opt span.lbl{font-size:15px;font-weight:700;color:#2b241d}
.opt .ar{margin-left:auto;width:26px;height:26px;border-radius:50%;background:#f8f6f2;color:var(--g600);display:flex;align-items:center;justify-content:center;transition:.18s var(--ease-out)}
.opt:hover{border-color:var(--g500);background:#fefdfb;transform:translateY(-2px);box-shadow:0 13px 24px -12px rgba(124, 89, 20, .45)}

.opt.sel .ar{background:var(--gold);color:#fff}

/* botão "continuar" (intro/recap) — ação primária sólida da marca */
.opt#contBtn{justify-content:center;background:linear-gradient(135deg,#362e24,#201b16);border-color:#201b16;box-shadow:0 12px 24px -12px rgba(32, 27, 22, .6)}
.opt#contBtn span.lbl{color:#fff;flex:0 0 auto}
.opt#contBtn .ar{margin-left:8px;background:rgba(255,255,255,.16);color:#fff}
.opt#contBtn:hover{transform:translateY(-2px);background:linear-gradient(135deg,#3f352a,#28221b)}
.opt#contBtn:hover .ar{background:rgba(255,255,255,.28);color:#fff}

/* ===== Cartão de confirmação de identidade (consulta CPF) ===== */
.idcard{margin-top:12px;background:#fff;border:1px solid #e9e7e2;border-radius:18px;padding:14px 16px;box-shadow:0 16px 40px -20px rgba(37, 31, 24, .5);animation:pop .4s ease both;overflow:hidden}
.idcard .id-head{margin:0 -16px 6px;padding:0 16px 12px;border-bottom:1px solid #f2f1ee}
.idcard .id-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--g700);background:#f7f4ed;border:1px solid #ece3cf;padding:6px 11px;border-radius:100px}
.idcard .id-badge svg{width:13px;height:13px}
.idcard .id-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed #f2f1ee;font-size:13px}
.idcard .id-row:last-of-type{border-bottom:0}
.idcard .id-k{color:#7c808a;font-weight:600;flex-shrink:0}
.idcard .id-v{color:#221f1b;font-weight:700;text-align:right;word-break:break-word}
.idcard .id-v.ok{color:var(--g600)}

.addrcard{margin-top:12px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 18px 44px -20px rgba(37, 31, 24, .5);animation:pop .4s ease both;border:1px solid #e9e7e2}
.addr-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--g700);font-size:15px}
.addr-sub{font-size:12px;color:#7c808a;margin:4px 0 13px;line-height:1.4}
.addr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addr-field{display:flex;flex-direction:column;gap:5px}
.addr-field.full{grid-column:1 / -1}
.addr-field label{font-size:11px;font-weight:700;color:#69645d;padding-left:2px}
.addr-field input{border:1.5px solid #e6e0d3;border-radius:12px;padding:12px 13px;font-family:inherit;font-size:14.5px;color:#221f1b;outline:none;background:#fff;width:100%}

.addr-field input.bad{border-color:#ef4444;background:#fef2f2}
.addr-cep-msg{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;min-height:15px;margin-top:1px}

/* ============================================================
   WHATSAPP AUTÊNTICO — camada final de override
   Faz a tela parecer o WhatsApp de verdade (topo, papel de parede,
   balões com rabinho + horário, respostas em balão verde, barra de digitar).
   Os cartões de oferta continuam com a identidade dourada da SuperSim
   (leem como "mensagens de template" da conta comercial).
   ============================================================ */
:root{
  --wa-green:#075e54; --wa-green-d:#054c44; --wa-teal:#128c7e;
  --wa-send:#00a884; --wa-check:#25d366;
  --wa-out:#d9fdd3; --wa-in:#ffffff; --wa-tick:#53bdeb;
  --wa-time:#667781; --wa-wall:#e4ddd4;
  --wa-enc-bg:#fdf4c9; --wa-enc-tx:#5b5340; --wa-foot:#f0f2f5;
}
/* moldura: menos "cartão", mais tela de celular */
.app{border-radius:28px !important;background:var(--wa-wall) !important;
  border:1px solid rgba(4,40,34,.18) !important;
  box-shadow:0 42px 84px -30px rgba(4,40,34,.55),0 0 0 1px rgba(0,0,0,.05) !important}

/* ===== barra de status do celular ===== */
.brandbar{display:none !important}
.phone-status{display:flex;align-items:center;justify-content:space-between;
  background:var(--wa-green);color:#fff;padding:7px 18px 5px;position:relative;z-index:23;
  font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:600;letter-spacing:.2px}
.phone-status .ps-r{display:flex;align-items:center;gap:6px}
.phone-status svg{display:block}

/* ===== header do WhatsApp ===== */
.wa-top{background:var(--wa-green) !important;color:#fff;gap:8px;padding:6px 10px 8px !important;align-items:center}
.wa-top::after{display:none !important}
.wa-top .bk{opacity:1;margin:0 -2px 0 0;padding:2px}
.wa-top .av{width:40px !important;height:40px !important;border:0 !important;background:#0a5b51 !important}
.wa-top .av-on{display:none !important}
.wa-top .who{margin-left:1px}
.wa-top .nm{font-size:16px !important;font-weight:600 !important;color:#fff}
.wa-top .nm .verif svg path:first-child{fill:var(--wa-check)}
.wa-top .st{font-size:12.5px !important;color:#cfe9df !important}
.wa-top .st i{display:none !important}
.wa-top .st.typing{color:#a7e9cf !important;font-style:normal !important;font-weight:500}
.wa-top .ic{gap:20px !important;align-items:center;color:#fff;opacity:.97}
.wa-top .ic .sec-tag{display:none !important}
.wa-top .ic svg{width:22px;height:22px}

/* progresso discreto e verde */
.wa-prog{height:3px !important;background:rgba(0,0,0,.14) !important}
.wa-prog i{background:linear-gradient(90deg,var(--wa-teal),var(--wa-send)) !important;box-shadow:none !important}

/* aviso de criptografia (amarelinho característico) */
.chan-note{background:var(--wa-enc-bg) !important;color:var(--wa-enc-tx) !important;
  border-bottom:0 !important;font-size:10.6px !important;padding:6px 22px !important;line-height:1.35}
.chan-note b{color:#3d3524 !important}
.chan-note svg path{fill:#caa63f !important}

/* faixa de conta verificada — cartão limpo (selo verde + texto) */
.official-bar{display:flex;align-items:center;gap:11px;padding:9px 15px;
  background:#f4faf7;border-bottom:1px solid #e4efe8;position:relative;z-index:19}
.official-bar .ob-badge{width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#2ee06a,#12a150);
  box-shadow:0 4px 10px -3px rgba(18,161,80,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.official-bar .ob-badge svg{display:block}
.official-bar .ob-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.official-bar .ob-tx b{font-size:12.6px;font-weight:800;color:#0c3b31;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.official-bar .ob-tx span{font-size:10.6px;font-weight:600;color:#5f8377}
.official-bar .ob-lock{flex-shrink:0;color:#8bb3a5}

/* ===== papel de parede ===== */
.stage{background:var(--wa-wall) url("images/wa-bg.svg") repeat !important;background-size:360px !important}
.qpage{padding:14px 9px 20px !important}
.qtop{gap:5px !important}

/* ===== balões ===== */
.qrow{gap:0 !important;align-items:flex-end}
.qrow .mav{display:none !important}
.bubble{position:relative;background:var(--wa-in) !important;color:#111b21 !important;
  border:0 !important;border-radius:9px !important;border-top-left-radius:0 !important;
  box-shadow:0 1px .5px rgba(11,20,26,.13) !important;
  padding:6px 9px 7px 10px !important;font-size:14.7px !important;line-height:1.42 !important;
  max-width:80% !important;margin-left:7px}
.bubble.q{background:var(--wa-in) !important;font-weight:600 !important;font-size:15px !important}
.bubble b{color:var(--wa-green) !important}
/* rabinho do balão que entra (topo-esquerda) */
.qrow:not(.out) .bubble::before{content:"";position:absolute;top:0;left:-7px;width:9px;height:13px;
  background:var(--wa-in);clip-path:polygon(100% 0,100% 100%,0 0)}
/* horário dentro do balão */
.bubble .bmeta{float:right;margin:5px -1px -2px 9px;font-size:10px;color:var(--wa-time);
  line-height:1;position:relative;top:3px;white-space:nowrap;font-weight:500}
.bubble .bmeta svg{vertical-align:-2px;margin-left:2px}

/* ===== resposta do usuário: balão verde à direita ===== */
.qrow.out{justify-content:flex-end;margin:2px 0}
.qrow.out .bubble{background:var(--wa-out) !important;color:#111b21 !important;
  border-top-left-radius:9px !important;border-top-right-radius:0 !important;margin:0 7px 0 0;
  animation:popOut .22s ease both}
.qrow.out .bubble::after{content:"";position:absolute;top:0;right:-7px;width:9px;height:13px;
  background:var(--wa-out);clip-path:polygon(0 0,0 100%,100% 0)}
.qrow.out .bubble .bmeta{color:#5f7c6b}
@keyframes popOut{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}

/* ===== respostas rápidas (botões estilo WhatsApp Business) ===== */
.opts{padding-top:12px !important;margin-top:8px !important;gap:8px !important}
.opt{background:#fff !important;border:1px solid #e7ebed !important;border-radius:13px !important;
  padding:12px 13px !important;gap:12px !important;box-shadow:0 1px 2px rgba(11,20,26,.09) !important}
.opt .em{width:38px !important;height:38px !important;min-width:38px !important;border-radius:50% !important;
  background:#e9f6f1 !important;border:1px solid #d7ede5 !important;font-size:19px !important;box-shadow:none !important}
.opt span.lbl{color:#111b21 !important;font-weight:600 !important;font-size:14.7px !important}
.opt .ar{background:#eef7f4 !important;color:var(--wa-teal) !important}
.opt:hover{border-color:var(--wa-teal) !important;background:#fbfffe !important;box-shadow:0 6px 16px -10px rgba(18,140,126,.5) !important}
.opt:hover .ar{background:var(--wa-teal) !important;color:#fff !important}
.opt.sel{border-color:var(--wa-send) !important;background:#f1fff0 !important;box-shadow:0 0 0 2px rgba(0,168,132,.32) !important}
.opt.sel .em,.opt.sel .ar{background:var(--wa-send) !important;color:#fff !important;border-color:var(--wa-send) !important}
/* botão continuar/confirmar identidade — ação primária teal */
.opt#contBtn,.opt#idBtn{justify-content:center !important;background:var(--wa-teal) !important;border-color:var(--wa-teal) !important;box-shadow:0 10px 22px -12px rgba(18,140,126,.7) !important}
.opt#contBtn span.lbl,.opt#idBtn span.lbl{color:#fff !important;flex:0 0 auto}
.opt#contBtn .em,.opt#idBtn .em{background:rgba(255,255,255,.2) !important;border-color:transparent !important}
.opt#contBtn .ar,.opt#idBtn .ar{background:rgba(255,255,255,.2) !important;color:#fff !important}
.opt#contBtn:hover,.opt#idBtn:hover{background:#0f7a6d !important}

/* ===== barra de digitar (rodapé fixo do WhatsApp) ===== */
.wa-foot{display:none;align-items:center;gap:7px;padding:7px 8px;background:var(--wa-foot);
  position:relative;z-index:20;flex-shrink:0}
.wa-foot.active{display:flex}
.wa-foot .wf-pill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;
  border-radius:24px;padding:9px 12px;box-shadow:0 1px 1px rgba(11,20,26,.06)}
.wa-foot .wf-pill>svg{flex-shrink:0;color:#8696a0}
.wf-input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;
  font-size:15px;color:#111b21}
.wf-input::placeholder{color:#8696a0}
.wa-foot .wf-fab{width:46px;height:46px;flex-shrink:0;border:0;border-radius:50%;
  background:var(--wa-send);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 10px -3px rgba(0,168,132,.6);transition:transform .12s ease,background .2s}
.wa-foot .wf-fab:active{transform:scale(.94)}
.wa-foot.active .wf-pill{box-shadow:0 0 0 2px rgba(0,168,132,.25)}

/* cartões de oferta: mantêm o dourado, mas com respiro de "mensagem" */
.vcard,.idcard,.summary,.signcard,.contract,.addrcard,.offer{margin-left:7px !important;max-width:95% !important}
@media (prefers-reduced-motion:reduce){.qrow.out .bubble{animation:none}}

/* ===== Efeitos sonoros do chat — som de mensagem (estilo Typebot) =====
   Toca um MP3 curto e agradável (o mesmo "ding" de app de mensagem).
   Só toca depois do 1º toque do usuário (política de autoplay dos browsers). */
var SFX = (function(){
  var URL='sounds/recv.mp3';
  var unlocked=false, muted=false, last=0;
  try{ muted = localStorage.getItem('sfx_off')==='1'; }catch(e){}
  function make(vol){ var a=new Audio(URL); a.volume=vol; a.preload='auto'; return a; }
  function unlock(){
    if(unlocked) return; unlocked=true;
    try{ var p=make(0); var pr=p.play(); if(pr&&pr.then){ pr.then(function(){ p.pause(); p.currentTime=0; }).catch(function(){}); } }catch(e){}
  }
  function play(vol){
    if(muted || !unlocked) return;
    var n=Date.now(); if(n-last<70) return; last=n;   // evita empilhar sons
    try{ make(vol).play().catch(function(){}); }catch(e){}
  }
  return {
    unlock: unlock,
    sent: function(){ play(0.5); },    // mensagem enviada (mais discreto)
    recv: function(){ play(0.85); },   // mensagem recebida (o "ding" cheio)
    setMuted: function(m){ muted=!!m; try{ localStorage.setItem('sfx_off', m?'1':'0'); }catch(e){} }
  };
})();
['pointerdown','touchstart','keydown','click'].forEach(function(ev){
  document.addEventListener(ev, function(){ SFX.unlock(); }, {once:true, passive:true});
});

/* ===== Gênero pelo primeiro nome — a Júlia flexiona sozinha (nada de "honesto(a)") ===== */
var _FEM=null;
function ehFeminino(){
  if(_FEM!==null) return _FEM;
  var n=(localStorage.getItem('nome')||localStorage.getItem('name')||'').trim().toLowerCase().split(/\s+/)[0].replace(/[^a-zà-ú]/g,'');
  var fem=['beatriz','ester','esther','raquel','rachel','isabel','isabela','mabel','karen','caren','carem','miriam','miria','ruth','rute','ingrid','astrid','nicole','michele','michelle','gisele','simone','ivone','yasmin','iasmin','carmen','dolores','lourdes','pilar','flor','liz','mel','agnes','ines','ines','clarice','jaqueline','jacqueline','kelly','kely','shirley','sheila','janaina','madalena','heloa','maisa','thais','tais','lais','pietra','cleide','solange','marlene','darlene','irene','helen','ellen','isadora'];
  var masc=['luca','juca','noa','nicola','josua','joshua','ravi','ubiratan','ubirajara','sabino'];
  var f;
  if(fem.indexOf(n)>=0) f=true;
  else if(masc.indexOf(n)>=0) f=false;
  else f=/a$/.test(n);
  _FEM=f; return f;
}
/* resolve "honesto(a)", "você mesmo(a)", "PRÉ-APROVADO(A)", "(a)" -> forma certa do gênero */
function gener(s){
  s=String(s);
  if(ehFeminino()){
    return s.replace(/o\(a\)/g,'a').replace(/O\(A\)/g,'A').replace(/\(a\)/g,'a').replace(/\(A\)/g,'A');
  }
  return s.replace(/o\(a\)/g,'o').replace(/O\(A\)/g,'O').replace(/\(a\)/g,'').replace(/\(A\)/g,'');
}

/* puxa o que a página 3 mandou pela URL */
(function(){
  var url=new URLSearchParams(location.search);
  function mapFin(v){ v=(v||'').toLowerCase();
    if(v.indexOf('dívid')>=0||v.indexOf('divid')>=0)return'dividas';
    if(v.indexOf('saúd')>=0||v.indexOf('saud')>=0||v.indexOf('médic')>=0||v.indexOf('medic')>=0)return'medica';
    if(v.indexOf('reform')>=0)return'reforma';
    if(v.indexOf('investi')>=0||v.indexOf('negóc')>=0||v.indexOf('negoc')>=0)return'negocio';
    return 'outro'; }
  function mapRenda(v){ v=v||'';
    if(v.indexOf('1.500 a')>=0)return 2300; if(v.indexOf('3.000 a')>=0)return 4000;
    if(v.indexOf('5.000 a')>=0)return 7500; if(v.indexOf('Acima')>=0||v.indexOf('10.000')>=0)return 12000;
    if(v.indexOf('Até')>=0||v.indexOf('1.500')>=0)return 1300; return 0; }
  /* dados das 5 perguntas da página 3 chegam pela URL e têm PRIORIDADE.
     Se a finalidade mudou em relação à anterior, zera as respostas antigas (evita recap misturada).
     Persiste tudo no localStorage pra sincronizar mesmo abrindo o chat direto/refresh. */
  function mapOcc(v){ v=(v||'').toLowerCase();
    if(v.indexOf('desempreg')>=0)return'desempregado';
    if(v.indexOf('clt')>=0||v.indexOf('empregad')>=0)return'clt';
    if(v.indexOf('públic')>=0||v.indexOf('public')>=0||v.indexOf('funcion')>=0)return'publico';
    if(v.indexOf('autôn')>=0||v.indexOf('auton')>=0)return'autonomo';
    if(v.indexOf('empres')>=0||v.indexOf('mei')>=0)return'empresario';
    if(v.indexOf('aposent')>=0||v.indexOf('pension')>=0)return'aposentado';
    if(v.indexOf('dona')>=0||v.indexOf(' lar')>=0)return'donadecasa';
    if(v.indexOf('estudante')>=0)return'estudante';
    if(v.indexOf('rentista')>=0)return'rentista';
    return'outro'; }
  if(url.get('loanPurpose')){
    var f=mapFin(url.get('loanPurpose'));
    if(answers.finalidade && answers.finalidade!==f) answers={};
    saveAns('finalidade', f);
  }
  if(url.get('cpfSituation')) saveAns('negativado', /negativ/i.test(url.get('cpfSituation'))?'sim':'nao');
  if(url.get('monthlyIncome')){ var r=mapRenda(url.get('monthlyIncome')); if(r) saveAns('renda', r); }
  if(url.get('occupation')) saveAns('ocupacao_key', mapOcc(url.get('occupation')));
  if(url.get('education')) saveAns('escolaridade', url.get('education'));
})();

/* balão verde: resposta do usuário no chat */
function echoOut(page, text){ var host=(page&&page.querySelector)?page.querySelector('.qtop'):null; if(!host)return; var row=document.createElement('div'); row.className='qrow out'; row.innerHTML='<div class="bubble">'+String(text).replace(/</g,'<').replace(/>/g,'>')+'<span class="bmeta">'+nowHM()+' '+TICK2+'</span></div>'; host.appendChild(row); scrollPage(host); SFX.sent(); }

/* troca a página atual por outra (transição "próxima tela").
   incrementa gen pra invalidar timers de digitação da página anterior (anti-bug do "digitando") */
function swapPage(node){
  gen++;
  footIdle();
  var old=stage.querySelector('.qpage:not(.leave)');
  if(old){ old.classList.add('leave'); setTimeout(function(){ if(old&&old.parentNode) old.parentNode.removeChild(old); },280); }
  node.classList.add('qpage','enter');
  stage.appendChild(node);
}

/* mensagem de voz estilo WhatsApp */
function voiceRow(src){
  var bars=''; for(var i=0;i<26;i++){ bars+='<i style="height:'+(22+Math.round(Math.abs(Math.sin(i*1.3))*70))+'%"></i>'; }
  var id='v'+Math.random().toString(36).slice(2,8);
  var row=document.createElement('div'); row.className='qrow';
  row.innerHTML='<div class="mav"><img src="'+AV+'" alt=""></div>'
    +'<div class="bubble"><div class="voice"><button class="play" id="'+id+'b"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>'
    +'<div class="wave" id="'+id+'w">'+bars+'</div><div class="meta"><span class="t" id="'+id+'t">0:00</span></div></div></div>';
  setTimeout(function(){
    var a=new Audio(src); var btn=document.getElementById(id+'b'); var wave=document.getElementById(id+'w'); var t=document.getElementById(id+'t');
    var pi=document.querySelector('#'+id+'b svg');
    function fmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
    a.addEventListener('loadedmetadata',function(){ t.textContent=fmt(a.duration); });
    a.addEventListener('timeupdate',function(){ var p=a.currentTime/(a.duration||1); var bs=wave.querySelectorAll('i'); var on=Math.round(p*bs.length); bs.forEach(function(b,i){ b.classList.toggle('on',i<on); }); t.textContent=fmt(a.duration-a.currentTime); });
    a.addEventListener('ended',function(){ btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; wave.querySelectorAll('i').forEach(function(b){b.classList.remove('on');}); t.textContent=fmt(a.duration); });
    btn.onclick=function(){ if(a.paused){ a.play(); btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'; } else { a.pause(); btn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; } };
  },30);
  return row;
}

/* monta os balões da Júlia com DIGITAÇÃO em tempo real, depois chama done() */
function typeMessages(page, msgs, opts, done){
  if(typeof opts==='function'){ done=opts; opts=null; }
  var host=page.querySelector('.qtop'); var i=0; var myGen=gen;
  function alive(){ return myGen===gen; }
  (function next(){
    if(!alive()) return;
    if(i>=msgs.length){ setTyping(false); maybeVoice(); return; }
    setTyping(true);
    var ghost=i>0;
    var row=document.createElement('div'); row.className='qrow';
    row.innerHTML='<div class="mav'+(ghost?' ghost':'')+'"><img src="'+AV+'" alt=""></div><div class="bubble typing-b"><span class="typing"><span></span><span></span><span></span></span></div>';
    host.appendChild(row); scrollPage(host);
    var txt=msgs[i], delay=Math.min(850,320+txt.length*8);
    setTimeout(function(){
      if(!alive()){ if(row.parentNode) row.parentNode.removeChild(row); return; }
      var bub=row.querySelector('.bubble');
      bub.classList.remove('typing-b');
      if(i===msgs.length-1) bub.classList.add('q');
      bub.innerHTML=md(txt)+'<span class="bmeta">'+nowHM()+'</span>';
      scrollPage(host); i++; SFX.recv();
      if(i>=msgs.length){ setTyping(false); maybeVoice(); }
      else setTimeout(next, Math.min(1500, 480 + txt.length*12));
    },delay);
  })();
  function maybeVoice(){
    if(!alive()) return;
    if(VOICE_ENABLED && opts && opts.audio){
      setTyping(true);
      setTimeout(function(){ if(!alive())return; setTyping(false); host.appendChild(voiceRow(opts.audio)); scrollPage(host); SFX.recv(); setTimeout(function(){ if(alive())done&&done(); },300); }, 900);
    } else { done&&done(); }
  }
}

    + '</button>';

}

/* ============ MOTOR DE PERGUNTAS (uma pergunta por página) ============ */
function askQuestion(q,done){
  var msgs = typeof q.agent==='function'?q.agent():q.agent;
  var page=document.createElement('div');
  page.innerHTML='<div class="qtop"></div><div class="opts">'+buildOptsHtml(q.options)+'</div>';
  swapPage(page);
  var optsBox=page.querySelector('.opts');
  page.querySelectorAll('.opt').forEach(function(b){
    b.onclick=function(){
      var o=q.options[+b.dataset.i];
      page.querySelectorAll('.opt').forEach(function(x){ x.disabled=true; });
      b.classList.add('sel');
      echoOut(page, gener(o.label));
      // Painel: registra a pergunta do chat + a opção escolhida (qualificação).
      try{ if(window.arxLead){ var _q=Array.isArray(msgs)?msgs[msgs.length-1]:msgs; window.arxLead.log(_q, gener(o.label), 'analise'); } }catch(_e){}
      var ob=page.querySelector('.opts'); if(ob){ setTimeout(function(){ ob.style.transition='opacity .2s'; ob.style.opacity='0'; ob.style.pointerEvents='none'; },240); }
      if(q.save) saveAns(q.save,o.val);
      setProg();
      var go=function(){ done&&done(o.val); };
      if(o.reply){ setTimeout(function(){ showReply(typeof o.reply==='function'?o.reply():o.reply, go); },540); }
      else setTimeout(go,500);
    };
  });
  typeMessages(page, msgs, {audio:q.audio}, function(){ optsBox.classList.add('show'); scrollPage(page.querySelector('.qtop')); });
}
function askSequence(arr,done){ var i=0; (function nx(){ if(i>=arr.length){done&&done();return;} askQuestion(arr[i],function(){i++;nx();}); })(); }

/* resposta empática curta da Júlia, depois avança sozinha */

  typeMessages(page,[text],function(){ setTimeout(cb, readMs(text)); });
}

/* ====== campo de digitação (chave PIX, banco) ====== */
function askInput(cfg, onDone){
  var page=document.createElement('div');
  page.innerHTML='<div class="qtop"></div>';
  swapPage(page);
  function submit(){
    var v=wfInput.value.trim();
    if(cfg.validate){ if(!cfg.validate(v)){ try{wfInput.focus();}catch(_){} return; } } else if(!v){ try{wfInput.focus();}catch(_){} return; }
    echoOut(page, v);
    // Painel: só marca que passou por esta etapa de digitação (chave PIX/banco).
    // NÃO envia o valor digitado (v) — apenas a pergunta e que foi respondida.
    try{ if(window.arxLead){ var _a=(typeof cfg.agent==='function'?cfg.agent():cfg.agent); _a=Array.isArray(_a)?_a[_a.length-1]:_a; window.arxLead.log(_a, 'Respondeu', 'analise'); } }catch(_e){}
    footIdle();
    setProg(); if(cfg.save) saveAns(cfg.save,v); if(cfg.store){ try{ localStorage.setItem(cfg.store,v); }catch(e){} }
    setTimeout(function(){ onDone&&onDone(v); }, 360);
  }
  typeMessages(page, (typeof cfg.agent==='function'?cfg.agent():cfg.agent), function(){ footActive(cfg, submit); });
}

/* ============ OFERTA (calcula com VÁRIOS fatores) ============ */
function rendaTxt(){ var r=Number(answers.renda)||0;
  if(r<=1300)return 'cerca de R$ 1.500'; if(r<=2300)return 'entre R$ 1.500 e R$ 3.000';
  if(r<=4000)return 'entre R$ 3.000 e R$ 5.000'; if(r<=7500)return 'acima de R$ 5.000'; return 'acima de R$ 10.000'; }
function calcAprovado(){
  var renda=Number(answers.renda)||2300, max=renda*6;
  if(answers.negativado==='sim') max*=0.55;
  if(answers.finalidade==='negocio'){ max*=1.12; if(answers.fatura==='+15')max*=1.15; if(answers.fatura==='ate5')max*=0.9; }
  if(answers.finalidade==='reforma'){ max*=1.05; if(answers.imovel==='proprio')max*=1.08; }
  if(answers.finalidade==='dividas'){ if(answers.valordivida==='+10k')max*=0.9; if(answers.pagaminimo==='nao')max*=0.85; }
  if(answers.finalidade==='medica' && answers.temparte==='sim') max*=1.05;
  var occ=answers.ocupacao_key;
  if(occ==='publico'||occ==='aposentado') max*=1.10;
  if(occ==='clt'){ if(answers.tempo_emprego==='estavel') max*=1.06; else if(answers.tempo_emprego==='novo') max*=0.96; }
  if(occ==='empresario' && answers.cnpj==='sim') max*=1.05;
  if(occ==='autonomo' && answers.estab_renda==='varia') max*=0.93;
  if(occ==='desempregado') max*=0.62;
  var esc=escolaridadeTxt(); if(esc==='ensino superior'||esc==='pós-graduação') max*=1.04;
  /* teto do PRÉ-APROVADO (só o que aparece no slider pra ela escolher).
     Pode passar de 5k pra ela poder pedir mais alto, mas o que é LIBERADO de fato
     (calcLiberado, após o Serasa) é sempre travado abaixo de 5k. */
  max=Math.min(8000,max); max=Math.max(2000,Math.round(max/500)*500);
  return max;
}

/* ---- helpers de cálculo ---- */
var JUROS=0.0081;
function parcelaDe(amount,n){ var r=JUROS; return amount*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1); }
function brl2(v){ return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function capMes(d){ var s=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtData(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }

/* ====== valor LIBERADO conforme o perfil (análise rigorosa) ======
   Regra travada: o valor liberado após o Serasa é SEMPRE abaixo de R$ 5.000,
   varia por perfil (renda, negativado, ocupação, finalidade) e nunca é redondo. */
var TETO_LIBERADO=4900;                            // teto rígido: nunca chega em 5k
function calcLiberado(pedido){
  var teto=Math.min(calcAprovado(), TETO_LIBERADO);
  var base=Math.min(pedido, teto);
  var conf=0.58;                                  // confiança base (análise mais rigorosa)
  if(answers.negativado==='sim') conf-=0.18;
  if(answers.negativado==='nao') conf+=0.10;
  if(answers.finalidade==='dividas'){ if(answers.pagaminimo==='nao') conf-=0.10; if(answers.valordivida==='+10k') conf-=0.06; }
  if(answers.finalidade==='negocio' && answers.negstatus==='sim') conf+=0.05;
  if(answers.finalidade==='reforma' && answers.imovel==='proprio') conf+=0.05;
  if(answers.finalidade==='medica' && answers.urgencia==='agora') conf+=0.03;
  var occL=answers.ocupacao_key;
  if(occL==='publico'||occL==='aposentado') conf+=0.08;
  if(occL==='clt' && answers.tempo_emprego==='estavel') conf+=0.05;
  if(occL==='clt' && answers.tempo_emprego==='novo') conf-=0.05;
  if(occL==='empresario' && answers.cnpj==='sim') conf+=0.04;
  if(occL==='autonomo' && answers.estab_renda==='varia') conf-=0.06;
  if(occL==='desempregado') conf-=0.14;
  var rendaN=Number(answers.renda)||0;            // renda menor = mais conservador
  if(rendaN<=1300) conf-=0.06; else if(rendaN>=6500) conf+=0.05;
  conf=Math.max(0.30, Math.min(0.88, conf));
  var lib=base*conf;                               // valor cru
  // cauda determinística (110..849) pra ficar "quebrado", nunca redondo
  var tail=110 + ((Math.floor(pedido/500)*173 + (answers.finalidade?answers.finalidade.length*29:0)) % 740);
  lib=Math.floor(lib/1000)*1000 + tail;
  lib=Math.min(lib, pedido, teto);                 // nunca mais que o pedido nem o teto
  lib=Math.max(1500, lib);                         // mínimo garantido
  if(lib>=5000) lib=4000+(tail%850);               // trava dura: sempre abaixo de 5k
  return lib;
}

/* ====== ETAPA 2: ANÁLISE do valor (Serasa/banco) -> valor aprovado ====== */
function analiseValor(pedido){
  // tela de análise
  var page=document.createElement('div');
  page.innerHTML='<div class="analyzing"><div class="spin"></div><div class="at">Analisando seu limite...</div><div class="as" id="anSub">Consultando seu CPF no Serasa</div></div>';
  swapPage(page);
  var subs=['Consultando seu CPF no Serasa 🔎','Simulação segura — não afeta o seu score 🔒','Validando com o parceiro bancário 🏦','Liberando o melhor limite pra você ✨'];
  var i=0; var sub=page.querySelector('#anSub');
  var iv=setInterval(function(){ i++; if(sub&&subs[i]) sub.textContent=subs[i]; }, 900);
  setTimeout(function(){
    clearInterval(iv);
    var aprovado=calcLiberado(pedido);
    saveAns('valor_aprovado',aprovado);
    localStorage.setItem('selectedLoanAmount',aprovado);
    var cheio = aprovado >= pedido*0.97;
    var msgs;
    if(cheio){
      msgs=['Boa notícia'+(oi?(', '+oi):'')+'! 🎉 Acabei de consultar o seu **Serasa** e validar com o parceiro bancário...',
            'E deu tudo certo: **consegui aprovar '+brl(aprovado)+'** pra você receber **agora, na hora, via Pix** ✅',
            'Agora vem a parte boa: escolhe em **quantas vezes** fica confortável pra você pagar 👇'];
    } else {
      msgs=['Pronto'+(oi?(', '+oi):'')+'! Consultei o seu **Serasa** e analisei seu perfil junto ao banco com todo o cuidado 🔎',
            'Você tinha pedido '+brl(pedido)+', e olha: o que eu consigo **liberar com segurança pra você agora** é **'+brl(aprovado)+'** ✅',
            'E é sério, fica tranquilo(a) 💚 Assim que você quitar essa primeira vez, o seu limite sobe e eu consigo liberar bem mais.',
            'Bora garantir esse valor? Escolhe em **quantas vezes** quer pagar 👇'];
    }
    offerStep(msgs, function(p){ appendInstallments(p, aprovado); });
  }, 2900);
}

      if(d.length===8) buscaCep(d);
    });

    var m=parcelaDe(valor,n), pop=(n===24);
    var b=document.createElement('button'); b.className='pcard'+(pop?' pop':'');

      +'<div class="pc-val">'+brl2(m)+'<span>/mês</span></div>'
      +'<div class="pc-total">Total: '+brl(Math.round(m*n))+'</div>';

      localStorage.setItem('selectedInstallments',n);

function getFullName(){ try{ return (localStorage.getItem('nome')||localStorage.getItem('name')||'').trim(); }catch(e){ return ''; } }
function getCPF(){ try{ var c=(localStorage.getItem('cpf')||localStorage.getItem('document')||'').replace(/\D/g,'').slice(0,11);
  if(c.length===11) return c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'); return c; }catch(e){ return ''; } }

/* quadro de assinatura (canvas) + nome */
function appendSignPad(page, valor, n){
  var nomeAtual=getFullName();
  var card=document.createElement('div'); card.className='signcard';
  card.innerHTML=''
    +'<div class="sign-h">✍️ Assinatura do contrato</div>'
    +'<div class="sign-sub">Assine abaixo com o dedo (ou o mouse no computador).</div>'
    +'<div class="sign-pad" id="sigPad"><canvas id="sigCanvas"></canvas><button type="button" class="sign-clear" id="sigClear">Limpar</button></div>'
    +'<input class="sign-name" id="sigName" type="text" autocomplete="name" placeholder="Confirme seu nome completo" value="'+nomeAtual.replace(/"/g,'"')+'">'
    +'<button class="cta breathe" id="sigBtn" style="margin-top:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19l7-7 3 3-7 7-3-3z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg> Assinar e enviar contrato</button>'
    +'<div class="s-sec"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2"/></svg> Assinatura protegida — usada só no seu contrato</div>';
  page.appendChild(card); scrollPage(page.querySelector('.qtop'));

  var pad=card.querySelector('#sigPad'), canvas=card.querySelector('#sigCanvas');
  var nameInp=card.querySelector('#sigName');
  var ctx=canvas.getContext('2d'), drawing=false, hasInk=false, last=null;
  function fit(){ var dpr=Math.max(1,window.devicePixelRatio||1); var r=canvas.getBoundingClientRect();
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#664a12'; }
  setTimeout(fit,60);
  function pos(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  canvas.addEventListener('pointerdown',function(e){ drawing=true; last=pos(e); e.preventDefault(); try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
  canvas.addEventListener('pointermove',function(e){ if(!drawing)return; var p=pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p;
    if(!hasInk){ hasInk=true; pad.classList.add('inked'); } pad.classList.remove('bad'); e.preventDefault(); });
  canvas.addEventListener('pointerup',function(){ drawing=false; });
  canvas.addEventListener('pointerleave',function(){ drawing=false; });
  card.querySelector('#sigClear').onclick=function(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk=false; pad.classList.remove('inked'); };

  card.querySelector('#sigBtn').onclick=function(){
    var nm=nameInp.value.trim();
    if(!hasInk){ pad.classList.add('bad'); scrollPage(page.querySelector('.qtop')); return; }
    if(nm.length<3 || nm.indexOf(' ')<0){ nameInp.classList.add('bad'); nameInp.focus(); nameInp.placeholder='Digite seu nome completo'; return; }
    nameInp.classList.remove('bad');
    try{ localStorage.setItem('nome',nm); }catch(e){}
    // Painel: só marca que assinou e enviou (sem guardar nome nem imagem da assinatura).
    try{ if(window.arxLead) window.arxLead.log('Assinatura do contrato', 'Assinou e enviou', 'assinatura'); }catch(_e){}
    var sig=canvas.toDataURL('image/png');
    setProg();
    gerarContrato(valor, n, nm, sig);
  };
}

/* "gerando o documento" -> mostra o contrato preenchido (Júlia manda de volta) */
function gerarContrato(valor, n, nome, sig){
  var page=document.createElement('div');
  page.innerHTML='<div class="analyzing"><div class="spin"></div><div class="at">Gerando seu contrato...</div><div class="as">Inserindo sua assinatura e seus dados</div></div>';
  swapPage(page);
  setTimeout(function(){ renderContrato(valor, n, nome, sig); }, 1300);
}

function renderContrato(valor, n, nome, sig){
  var m=parcelaDe(valor,n), total=m*n, cpf=getCPF();
  var hoje=new Date(), dataStr=fmtData(hoje), diaVenc=hoje.getDate();
  var recebe = answers.chave_pix ? ('Pix — '+answers.chave_pix+(answers.banco?(' ('+answers.banco+')'):'')) : 'Pix';
  var endFull=localStorage.getItem('endereco_completo')||'';
  var page=document.createElement('div'); page.innerHTML='<div class="qtop"></div>';
  swapPage(page);
  typeMessages(page, [
    'Prontinho'+(oi?(', '+oi):'')+'! 🎉 Olha que lindo: aqui está o seu **contrato** já preenchidinho com os seus dados e a sua assinatura ✅',
    'Dá uma última conferida com calma e, pra eu liberar o seu Pix, é só **confirmar os termos** aqui embaixo 👇'
  ], function(){
    var doc=document.createElement('div'); doc.className='contract';
    doc.innerHTML=''
      +'<div class="doc-top"><h3>CONTRATO DE EMPRÉSTIMO PESSOAL</h3><div class="ds">SuperSim · Crédito Digital</div></div>'
      +'<div class="field"><span class="k">Contratante</span><span class="v">'+(nome||'—')+'</span></div>'
      +'<div class="field"><span class="k">CPF</span><span class="v">'+(cpf||'—')+'</span></div>'
      +'<div class="field"><span class="k">Valor do crédito</span><span class="v">'+brl(valor)+'</span></div>'
      +'<div class="field"><span class="k">Parcelamento</span><span class="v">'+n+'x de '+brl2(m)+'</span></div>'
      +'<div class="field"><span class="k">Total a pagar</span><span class="v">'+brl2(total)+'</span></div>'
      +'<div class="field"><span class="k">Recebimento</span><span class="v">'+recebe+'</span></div>'
      +(endFull?'<div class="field"><span class="k">Entrega do carnê</span><span class="v" style="font-size:11.5px;max-width:62%">'+endFull+'</span></div>':'')
      +'<div class="field"><span class="k">Data</span><span class="v">'+dataStr+'</span></div>'
      +'<div class="terms">'
        +'<b>1.</b> <b>'+(nome||'O(A) CONTRATANTE')+'</b> declara que as informações fornecidas são verídicas e de sua responsabilidade.<br>'
        +'<b>2.</b> O crédito de <b>'+brl(valor)+'</b> será liberado via Pix após a confirmação dos termos e a quitação das taxas obrigatórias da operação.<br>'
        +'<b>3.</b> O pagamento será em <b>'+n+'x de '+brl2(m)+'</b>, com vencimento mensal todo dia '+diaVenc+'.<br>'
        +'<b>4.</b> A assinatura digital abaixo tem validade jurídica nos termos da MP 2.200-2/2001 (ICP-Brasil).'
        +(endFull?'<br><b>5.</b> O <b>carnê de pagamento</b> impresso será enviado para o endereço informado: <b>'+endFull+'</b>.':'')
      +'</div>'
      +'<div class="sigblock"><img src="'+sig+'" alt="assinatura"><div class="sigline"></div>'
        +'<div class="signame">'+(nome||'')+'</div><div class="sigmeta">Assinado digitalmente em '+dataStr+'</div></div>'
      +'<div class="stamp"><span>✔ ASSINADO DIGITALMENTE</span></div>';
    page.appendChild(doc);

    var wrap=document.createElement('div'); wrap.className='term-wrap';
    wrap.innerHTML=''
      +'<label class="term-check" id="termLbl"><input type="checkbox" id="termChk"> <span>Li e estou de acordo com os <b>termos do contrato</b> acima.</span></label>'
      +'<button class="cta breathe" id="termBtn" style="margin-top:12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Confirmar termos e receber crédito</button>';
    page.appendChild(wrap);
    scrollPage(page.querySelector('.qtop'));

    var chk=wrap.querySelector('#termChk'), lbl=wrap.querySelector('#termLbl');
    wrap.querySelector('#termBtn').onclick=function(){
      if(!chk.checked){ lbl.classList.add('shake'); setTimeout(function(){ lbl.classList.remove('shake'); },500); return; }
      try{ localStorage.setItem('cf_contrato','aceito'); }catch(e){}
      setProg();
      var p=new URLSearchParams(window.location.search); window.location.href='../6/index.html'+(p.toString()?'?'+p:'');
    };
  });
}

setTimeout(run, 350);
</script>
